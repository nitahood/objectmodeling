<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Object Modeling Lab: UKM library case</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap">
<style>
:root{
  --paper:#F2F6FB; --surface:#FBFDFF; --surface-2:#E6EFF9; --ink:#16263D; --muted:#4A5B73;
  --heading:#0B2E55; --accent:#1B63A6; --accent-ink:#FBFDFF; --accent-soft:#D6E7F8;
  --line:#C5D5E8; --rule:#B9D2EC; --ok:#0D6B5B; --ok-bg:#DFF3EE; --warn:#874600; --warn-bg:#FCEEDB;
  --focus:#C26A00; --shadow:0 1px 0 rgba(11,46,85,.06);
  --font-body:'Atkinson Hyperlegible', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --font-head:'Fraunces', Georgia, 'Times New Roman', serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1A2B; --surface:#14243A; --surface-2:#1B2F4A; --ink:#E5EDF7; --muted:#A8BAD2;
    --heading:#CFE3F8; --accent:#7DB6EE; --accent-ink:#0B1A2C; --accent-soft:#1F3B5E;
    --line:#2D4567; --rule:#2A4466; --ok:#6FD3BD; --ok-bg:#143C37; --warn:#F3B66E; --warn-bg:#3E2A12;
    --focus:#FFB54A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1A2B; --surface:#14243A; --surface-2:#1B2F4A; --ink:#E5EDF7; --muted:#A8BAD2;
  --heading:#CFE3F8; --accent:#7DB6EE; --accent-ink:#0B1A2C; --accent-soft:#1F3B5E;
  --line:#2D4567; --rule:#2A4466; --ok:#6FD3BD; --ok-bg:#143C37; --warn:#F3B66E; --warn-bg:#3E2A12;
  --focus:#FFB54A; color-scheme:dark;
}
:root[data-contrast="high"]{
  --paper:#FFFFFF; --surface:#FFFFFF; --surface-2:#F0F0F0; --ink:#000000; --muted:#1A1A1A;
  --heading:#000000; --accent:#003C7E; --accent-ink:#FFFFFF; --accent-soft:#DDE8F5;
  --line:#000000; --rule:#000000; --ok:#00502F; --ok-bg:#E6F4EC; --warn:#6B2C00; --warn-bg:#FFF0E0;
  --focus:#B00060; color-scheme:light;
}
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top, 0px); padding-bottom:env(safe-area-inset-bottom, 0px); }
html{ scroll-padding-top:calc(env(safe-area-inset-top, 0px) + 140px); font-size:100%; }
html[data-size="1"]{ font-size:112.5%; }
html[data-size="2"]{ font-size:125%; }
html[data-size="3"]{ font-size:137.5%; }
*,*::before,*::after{ box-sizing:inherit; }
body{ margin:0; background:var(--paper); color:var(--ink); font-family:var(--font-body); font-size:1.0625rem; line-height:1.15; }
html[data-spacing="on"] body{ letter-spacing:.04em; word-spacing:.12em; line-height:1.85; }
html[data-spacing="on"] p, html[data-spacing="on"] li{ max-width:62ch; }
html[data-motion="reduce"] *{ transition:none !important; animation:none !important; scroll-behavior:auto !important; }
@media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }
body::before{ content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top, 0px); z-index:10; background:var(--surface); }
a{ color:var(--accent); }
:focus-visible{ outline:3px solid var(--focus); outline-offset:3px; border-radius:6px; }
.skip{ position:absolute; left:12px; top:-60px; background:var(--accent); color:var(--accent-ink); padding:10px 16px; border-radius:8px; z-index:20; text-decoration:none; font-weight:700; }
.skip:focus{ top:calc(env(safe-area-inset-top, 0px) + 10px); }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

/* Top bar */
.top{ position:sticky; top:env(safe-area-inset-top, 0px); z-index:5; background:var(--surface); border-bottom:1px solid var(--line); }
.top-in{ max-width:1120px; margin:0 auto; padding:12px 20px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
.brand{ display:flex; align-items:center; gap:12px; margin-right:auto; min-width:0; }
.brand svg{ flex:none; }
.brand b{ font-family:var(--font-head); font-weight:600; font-size:1.25rem; color:var(--heading); display:block; line-height:1.2; }
.brand span{ font-size:.875rem; color:var(--muted); }
.seg{ display:inline-flex; border:1px solid var(--line); border-radius:999px; padding:3px; background:var(--surface-2); }
.seg button{ border:0; background:transparent; color:var(--ink); font:inherit; font-weight:700; min-width:48px; min-height:40px; border-radius:999px; cursor:pointer; padding:0 14px; }
.seg button[aria-pressed="true"]{ background:var(--accent); color:var(--accent-ink); }
.btn{ font:inherit; font-weight:700; min-height:44px; padding:0 18px; border-radius:10px; border:1px solid var(--accent); background:var(--accent); color:var(--accent-ink); cursor:pointer; display:inline-flex; align-items:center; gap:8px; }
.btn.sec{ background:transparent; color:var(--accent); }
.btn.ghost{ background:transparent; color:var(--ink); border-color:var(--line); }
.btn:disabled{ opacity:.5; cursor:not-allowed; }
.btn.sm{ min-height:36px; padding:0 12px; font-size:.9375rem; }
.a11y{ max-width:1120px; margin:0 auto; padding:0 20px 16px; display:none; }
.a11y.open{ display:block; }
.a11y-grid{ display:flex; flex-wrap:wrap; gap:12px 28px; align-items:center; background:var(--surface-2); border:1px solid var(--line); border-radius:12px; padding:14px 18px; }
.a11y fieldset{ border:0; padding:0; margin:0; display:flex; align-items:center; gap:8px; }
.a11y legend{ float:left; margin-right:8px; font-weight:700; }
.sw{ display:inline-flex; align-items:center; gap:10px; cursor:pointer; min-height:44px; }
.sw input{ width:22px; height:22px; accent-color:var(--accent); }

/* Tabs */
.tabs{ max-width:1120px; margin:0 auto; padding:0 20px; display:flex; gap:4px; overflow-x:auto; }
.tabs button{ font:inherit; background:none; border:0; border-bottom:3px solid transparent; color:var(--muted); padding:12px 14px; min-height:48px; cursor:pointer; font-weight:700; white-space:nowrap; }
.tabs button[aria-current="page"]{ color:var(--heading); border-bottom-color:var(--accent); }
.prog{ margin-left:auto; align-self:center; font-size:.875rem; color:var(--muted); white-space:nowrap; padding-left:12px; }

main{ max-width:1120px; margin:0 auto; padding:16px 20px 56px; }
h1,h2,h3{ font-family:var(--font-head); color:var(--heading); font-weight:600; line-height:1.2; }
h2{ font-size:2rem; margin:0 0 6px; }
h3{ font-size:1.375rem; margin:16px 0 8px; }
h4{ font-size:1.0625rem; margin:12px 0 4px; color:var(--heading); }
p{ margin:0 0 8px; max-width:72ch; }
li{ line-height:1.25; }
.lede{ font-size:1.1875rem; color:var(--ink); max-width:64ch; }
.muted{ color:var(--muted); }
.row{ display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
.grid2{ display:grid; grid-template-columns:repeat(auto-fit, minmax(300px,1fr)); gap:20px; }
.panel{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px; }
.note{ border-left:4px solid var(--accent); background:var(--accent-soft); padding:12px 16px; border-radius:0 10px 10px 0; max-width:72ch; }

/* Catalogue card hero */
.catcard{ position:relative; background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:28px 32px 56px 32px;
  background-image:linear-gradient(var(--surface), var(--surface)), repeating-linear-gradient(to bottom, transparent 0, transparent 31px, var(--rule) 31px, var(--rule) 32px);
  background-size:100% 76px, 100% 100%; background-repeat:no-repeat; background-position:0 0, 0 0;
  box-shadow:0 2px 0 var(--line), 0 4px 0 var(--surface-2), 0 5px 0 var(--line); margin-bottom:28px; }
.catcard::after{ content:""; position:absolute; left:50%; bottom:16px; width:22px; height:22px; margin-left:-11px; border-radius:50%; background:var(--paper); border:1px solid var(--line); }
.callno{ display:flex; justify-content:space-between; gap:12px; font-size:.875rem; color:var(--muted); border-bottom:2px solid var(--accent); padding-bottom:8px; margin-bottom:20px; }
.catcard h2{ font-size:clamp(1.75rem, 3.6vw, 2.75rem); margin-bottom:12px; }

/* Lists & tables */
.tbl-wrap{ overflow-x:auto; }
table{ border-collapse:collapse; width:100%; background:var(--surface); }
th,td{ text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:top; }
th{ color:var(--heading); background:var(--surface-2); }
.actors{ display:grid; grid-template-columns:repeat(auto-fit, minmax(240px,1fr)); gap:16px; }
.actor{ border:1px solid var(--line); border-radius:12px; padding:16px; background:var(--surface); }
.actor b{ display:block; font-family:var(--font-head); font-size:1.125rem; color:var(--heading); }
ol.steps{ padding-left:1.4em; }
ol.steps li{ margin-bottom:6px; }

/* Stepper */
.stepper{ display:flex; gap:8px; flex-wrap:wrap; margin:4px 0 12px; padding:0; list-style:none; }
.stepper button{ font:inherit; border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:999px; min-height:44px; padding:0 16px; cursor:pointer; display:inline-flex; align-items:center; gap:8px; }
.stepper button[aria-current="step"]{ border-color:var(--accent); background:var(--accent-soft); color:var(--heading); font-weight:700; }
.stepper .n{ display:inline-grid; place-items:center; width:26px; height:26px; border-radius:50%; background:var(--surface-2); font-size:.8125rem; font-weight:700; }
.stepper .done .n{ background:var(--ok); color:var(--surface); }
.pager{ display:flex; justify-content:space-between; gap:12px; margin-top:18px; flex-wrap:wrap; }

/* UML object card */
.uml{ border:2px solid var(--ink); border-radius:10px; background:var(--surface); min-width:200px; overflow:hidden; }
.uml .hd{ background:var(--accent-soft); padding:6px 12px; font-weight:700; text-align:center; border-bottom:2px solid var(--ink); }
.uml .cp{ padding:6px 12px; border-bottom:1px solid var(--ink); font-family:var(--font-body); }
.uml .cp:last-child{ border-bottom:0; }
.uml u{ text-underline-offset:3px; }
.inst-list{ display:flex; flex-wrap:wrap; gap:14px; }
.form{ display:grid; gap:12px; }
label.f{ display:grid; gap:4px; font-weight:700; }
input[type=text], select, textarea{ font:inherit; color:var(--ink); background:var(--surface); border:1px solid var(--muted); border-radius:8px; padding:9px 11px; min-height:44px; width:100%; }
textarea{ min-height:90px; resize:vertical; }
.hint{ font-weight:400; color:var(--muted); font-size:.9375rem; }

/* Simulator */
.sim, .seqsim{ display:grid; grid-template-columns:minmax(280px, 340px) 1fr; gap:16px; align-items:start; }
.sim > .dgwrap, .seqsim > .dgwrap{ position:sticky; top:calc(env(safe-area-inset-top, 0px) + 112px); }
.fit svg.dg{ max-height:calc(100vh - 150px); }
@media (max-width:820px){ .seqsim{ grid-template-columns:1fr; } .sim > .dgwrap, .seqsim > .dgwrap{ position:static; } .fit svg.dg{ max-height:none; } }
.objstate{ margin:10px 0 0; padding:0; list-style:none; display:grid; gap:4px; font-size:.9375rem; }
.objstate li{ display:flex; justify-content:space-between; gap:10px; border-bottom:1px dashed var(--line); padding:3px 0; }
.objstate b{ color:var(--heading); }
.steplist{ margin:8px 0 0; padding-left:1.4em; font-size:.9375rem; }
.steplist li{ margin-bottom:4px; color:var(--muted); }
.steplist li[aria-current="step"]{ color:var(--ink); font-weight:700; }
.dg .cur{ stroke:var(--accent); stroke-width:3; }
.dg .hot{ fill:var(--accent) !important; stroke:var(--accent) !important; stroke-width:3 !important; }
.dg text.hott{ fill:var(--accent-ink) !important; font-weight:700; }
.dg .hotl{ stroke:var(--accent) !important; stroke-width:3.6 !important; }
.dg .seen{ stroke:var(--ok) !important; stroke-width:3 !important; }
.dg .seenl{ stroke:var(--ok) !important; stroke-width:3 !important; }
.dg .hlbox rect.cb{ stroke:var(--accent) !important; stroke-width:3.4 !important; }
.fit2 svg.dg{ margin:0 auto; max-height:max(300px, calc(100vh - 330px)); }
.simbar{ padding:12px 14px; }
.simprog{ flex:1; min-width:160px; }
.simpick{ gap:6px; margin-bottom:8px; }
.simpick button{ min-height:40px; padding:4px 12px; font-size:.9375rem; }
.simpick .sec{ color:var(--muted); font-size:.8125rem; margin-right:6px; }
.simpick button[aria-pressed="true"] .sec{ color:inherit; opacity:.8; }
.play-ctl label.inl{ display:flex; align-items:center; gap:6px; font-weight:700; }
.simbar .gtabs{ margin:0; }
.simbar .gtabs button{ min-height:40px; }
.vbadge{ display:inline-block; font-size:.75rem; font-weight:700; border:1px solid var(--accent); color:var(--accent); border-radius:999px; padding:1px 8px; margin-left:6px; vertical-align:middle; }
.dg text.curt{ fill:var(--accent); font-weight:700; }
@media (max-width:820px){ .sim{ grid-template-columns:1fr; } }
.msgs{ display:flex; flex-wrap:wrap; gap:8px; }
.msgs button{ font-family:ui-monospace, 'Cascadia Mono', Menlo, Consolas, monospace; font-size:.9375rem; }
.log{ list-style:none; padding:0; margin:12px 0 0; max-height:220px; overflow:auto; border:1px solid var(--line); border-radius:10px; background:var(--surface); }
.log li{ padding:6px 10px; border-bottom:1px solid var(--line); display:flex; gap:10px; }
.log li:last-child{ border-bottom:0; }
.tag{ font-weight:700; white-space:nowrap; }
.tag.ok{ color:var(--ok); } .tag.no{ color:var(--warn); }
progress{ width:100%; height:12px; accent-color:var(--accent); }
.play-ctl{ display:flex; flex-wrap:wrap; gap:10px; align-items:end; }
.play-ctl label.f{ font-size:.9375rem; }
.play-ctl select{ width:auto; min-width:140px; }
.narr{ margin:12px 0 0; }

/* Diagrams */
.dgwrap{ overflow-x:auto; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px; }
svg.dg{ display:block; max-width:100%; height:auto; }
.dg text{ font-family:var(--font-body); fill:var(--ink); font-size:13px; }
.dg .t-b{ font-weight:700; }
.dg .t-s{ font-size:12px; fill:var(--muted); }
.dg .node{ fill:var(--surface); stroke:var(--ink); stroke-width:1.6; }
.dg .soft{ fill:var(--accent-soft); stroke:var(--ink); stroke-width:1.6; }
.dg .bound{ fill:none; stroke:var(--ink); stroke-width:1.6; }
.dg .ln{ stroke:var(--ink); stroke-width:1.6; fill:none; }
.dg .dash{ stroke:var(--muted); stroke-width:1.4; stroke-dasharray:6 5; fill:none; }
.dg .ink{ fill:var(--ink); }
.dg .active rect{ fill:var(--accent); stroke:var(--accent); }
.dg .active text{ fill:var(--accent-ink); font-weight:700; }
.dg .lblbg{ fill:var(--surface); }
.dg .mult{ font-weight:700; fill:var(--accent); }
.dg .tri{ fill:var(--surface); stroke:var(--ink); stroke-width:1.6; }
#canvas .dg .cbox{ cursor:grab; touch-action:none; }
.dg .cbox:focus{ outline:none; }
.dg .cbox:focus rect.cb{ stroke:var(--focus); stroke-width:3; }
details.alt{ margin-top:10px; }
details.alt summary{ cursor:pointer; font-weight:700; min-height:44px; display:flex; align-items:center; }
.gtabs{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
.gtabs button{ font:inherit; border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:10px; min-height:44px; padding:0 14px; cursor:pointer; }
.gtabs button[aria-pressed="true"]{ background:var(--heading); color:var(--surface); border-color:var(--heading); }
.answers{ font-weight:700; color:var(--heading); margin-bottom:10px; }

/* Fine slider */
.fines{ display:grid; grid-template-columns:repeat(auto-fit, minmax(220px,1fr)); gap:16px; margin-top:14px; }
.fine-out{ font-family:var(--font-head); font-size:2rem; color:var(--heading); }
input[type=range]{ width:100%; accent-color:var(--accent); min-height:44px; }

/* Practice */
.q{ border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:10px; background:var(--surface); }
.q legend{ font-weight:700; padding:0 6px; }
.q fieldset{ border:0; margin:0; padding:0; }
.opt{ display:flex; gap:10px; align-items:flex-start; padding:8px 6px; border-radius:8px; cursor:pointer; min-height:44px; }
.opt input{ width:20px; height:20px; margin-top:3px; accent-color:var(--accent); flex:none; }
.fb{ margin-top:10px; padding:10px 14px; border-radius:8px; }
.fb.ok{ background:var(--ok-bg); color:var(--ink); border-left:4px solid var(--ok); }
.fb.no{ background:var(--warn-bg); color:var(--ink); border-left:4px solid var(--warn); }
.fb b.ok{ color:var(--ok); } .fb b.no{ color:var(--warn); }
.score{ font-family:var(--font-head); font-size:1.5rem; color:var(--heading); }
.order{ list-style:none; padding:0; margin:0; display:grid; gap:8px; }
.order li{ display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:8px 10px; }
.order .pos{ font-weight:700; width:28px; text-align:center; color:var(--muted); }
.order .txt{ flex:1; }
.order .mv{ display:flex; gap:6px; }
.order .mv button{ min-width:44px; }
.mrow{ display:grid; grid-template-columns:minmax(140px, 220px) 1fr; gap:12px; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); }
@media (max-width:600px){ .mrow{ grid-template-columns:1fr; } }

/* Builder */
.bld{ display:grid; grid-template-columns:minmax(280px, 360px) 1fr; gap:20px; align-items:start; }
@media (max-width:900px){ .bld{ grid-template-columns:1fr; } }
.bld .panel{ padding:18px; }
.items{ list-style:none; margin:8px 0 0; padding:0; display:grid; gap:6px; }
.items li{ display:flex; gap:8px; align-items:center; justify-content:space-between; border:1px solid var(--line); border-radius:8px; padding:6px 8px 6px 12px; background:var(--surface); }
.items li span{ min-width:0; overflow-wrap:anywhere; }
.canvas{ min-height:420px; }
.results{ list-style:none; padding:0; margin:10px 0 0; display:grid; gap:6px; }
.results li{ display:flex; gap:10px; padding:8px 12px; border-radius:8px; }
.results li.ok{ background:var(--ok-bg); } .results li.no{ background:var(--warn-bg); }
.results .ic{ font-weight:700; flex:none; width:1.4em; }
.results li.ok .ic{ color:var(--ok); } .results li.no .ic{ color:var(--warn); }
pre.code{ background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:14px; overflow:auto; font-size:.875rem; white-space:pre; }
.ucprev th{ width:30%; }
footer{ max-width:1120px; margin:0 auto; padding:0 20px 40px; color:var(--muted); font-size:.875rem; }
@media (max-width:640px){ .brand span{ display:none; } h2{ font-size:1.625rem; } .catcard{ padding:22px 18px 52px; } }
</style>
</head>
<body>
<a class="skip" href="#main" id="skipLink">Skip to content</a>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><rect x="3" y="3" width="34" height="34" rx="6" fill="var(--surface)" stroke="var(--ink)" stroke-width="2"/><rect x="3" y="3" width="34" height="11" rx="6" fill="var(--accent)"/><rect x="3" y="9" width="34" height="5" fill="var(--accent)"/><line x1="9" y1="21" x2="31" y2="21" stroke="var(--muted)" stroke-width="2"/><line x1="3" y1="26" x2="37" y2="26" stroke="var(--ink)" stroke-width="1.5"/><line x1="9" y1="31" x2="25" y2="31" stroke="var(--muted)" stroke-width="2"/></svg>
      <div><b id="appTitle">Object Modeling Lab</b><span id="appSub">Chapter 6 case study: the UKM library</span></div>
    </div>
    <div class="seg" role="group" aria-label="Language / Bahasa">
      <button type="button" data-lang="en" aria-pressed="true" lang="en">EN</button>
      <button type="button" data-lang="bm" aria-pressed="false" lang="ms">BM</button>
    </div>
    <button type="button" class="btn ghost" id="a11yBtn" aria-expanded="false" aria-controls="a11yPanel">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="4.5" r="2.2" fill="currentColor"/><path d="M4 8.5l8 1.8 8-1.8M12 10.3V15m0 0l-3.5 6.5M12 15l3.5 6.5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      <span id="a11yLbl">Accessibility</span>
    </button>
  </div>
  <div class="a11y" id="a11yPanel">

function fmt(str, o){ return String(str).replace(/\{(\w+)\}/g, function(_,k){ return o[k]!==undefined ? o[k] : ''; }); }
function simSend(msg, actorU){
  var m=S.sim, st=m.state, ok=true, why='', res='', actor=actorU||actingId(), o={who:who(actor)}, extra='';
  if(st==='lost'){ ok=false; why='lost'; }
  else if(msg==='checkOut()'){
    if(!instBy(actor)){ ok=false; why='noMember'; }
    else if(st==='available'){ m.state='onloan'; m.renewals=0; m.borrower=actor; res='out'; }
    else if(st==='onhold'){ if(actor!==m.reserver){ ok=false; why='holdFor'; o.who=who(m.reserver); } else { m.state='onloan'; m.renewals=0; m.borrower=actor; m.reserver=null; m.reserved=false; res='outHold'; } }
    else { ok=false; why='notAvail'; } }
  else if(msg==='checkIn()'){
    if(st==='onloan'||st==='overdue'){ var b=instBy(m.borrower); o.who=who(m.borrower);
      if(m.reserved){ m.state='onhold'; res='inHold'; } else { m.state='available'; res='inAvail'; }
      if(st==='overdue' && b){ var r=RATE[b.type]; extra=fmt(L(SIMTXT.a.inFine),{who:o.who,d:OVERDUE_DAYS,f:(OVERDUE_DAYS*r).toFixed(2),r:r.toFixed(2),cls:CLS[b.type]}); }
      m.borrower=null; }
    else { ok=false; why='needLoan'; } }
  else if(msg==='renew()'){
    if(st!=='onloan'){ ok=false; why= st==='overdue'?'renOver':'needLoan'; }
    else if(actor!==m.borrower){ ok=false; why='notBorrower'; o.who=who(m.borrower); }
    else if(m.reserved){ ok=false; why='renRes'; }
    else if(m.renewals>=2){ ok=false; why='renMax'; }
    else { m.renewals++; res='ren'; } }
  else if(msg==='reserve()'){
    if(!instBy(actor)){ ok=false; why='noMember'; }
    else if(st==='available'){ ok=false; why='resAvail'; }
    else if(st!=='onloan'&&st!=='overdue'){ ok=false; why='notAvail'; }
    else if(m.reserved){ ok=false; why='resTwice'; }
    else if(actor===m.borrower){ ok=false; why='ownRes'; }
    else { m.reserved=true; m.reserver=actor; res='res'; } }
  else if(msg==='dueDatePasses'){ if(st==='onloan'){ m.state='overdue'; res='due'; } else { ok=false; why='dueNot'; } }
  else if(msg==='holdExpires'){ if(st==='onhold'){ m.state='available'; m.reserved=false; m.reserver=null; res='hold'; } else { ok=false; why='holdNot'; } }
  else if(msg==='markLost()'){ if(st==='overdue'){ o.who=who(m.borrower); m.state='lost'; res='lost'; } else { ok=false; why='lostNot'; } }
  var detail = ok ? fmt(L(SIMTXT.a[res]),o)+extra : fmt(L(SIMTXT.r[why]),o);
  m.log.unshift({msg:msg, ok:ok, detail:detail, by: (msg==='dueDatePasses'||msg==='holdExpires') ? '' : (msg==='checkIn()'||msg==='markLost()' ? ':Librarian' : who(actor))});
  if(m.log.length>12) m.log.pop();
  announce((ok?L(SIMTXT.ok):L(SIMTXT.no))+': '+msg+'. '+detail);
  if(ok) done('learn-1');
}

function toPlant(M){
  function nm(s){ return String(s).replace(/[^A-Za-z0-9_]/g,'_')||'Class'; }
  var o='@startuml\n';
  M.classes.forEach(function(c){ o+='class '+nm(c.name)+' {\n'; c.attrs.forEach(function(a){ o+='  '+a+'\n'; }); c.methods.forEach(function(m){ o+='  '+m+'\n'; }); o+='}\n'; });
  M.rels.forEach(function(r){ var a=M.classes.filter(function(c){return c.id===r.from;})[0], b=M.classes.filter(function(c){return c.id===r.to;})[0]; if(!a||!b) return;
    if(r.kind==='inherit') o+=nm(a.name)+' --|> '+nm(b.name)+'\n';
    else o+=nm(a.name)+(r.m1?' "'+r.m1+'"':'')+' --'+(r.m2?' "'+r.m2+'"':'')+' '+nm(b.name)+(r.label?' : '+r.label:'')+'\n'; });
  return o+'@enduml';
}

  try{ if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(s).then(function(){ announce(L({en:'Copied',bm:'Disalin'})); }, fallback); } else fallback(); }catch(e){ fallback(); }
}

function svgPoint(svg, ev){ var pt=svg.createSVGPoint(); pt.x=ev.clientX; pt.y=ev.clientY; var m=svg.getScreenCTM(); return m? pt.matrixTransform(m.inverse()) : {x:0,y:0}; }
function redrawCanvas(keepFocus){ var cv=document.getElementById('canvas'); if(!cv) return; cv.innerHTML=classSVG(S.model,true,L({en:'Your class diagram',bm:'Rajah kelas anda'})); if(keepFocus){ var g=cv.querySelector('[data-id="'+keepFocus+'"]'); if(g) g.focus(); } }
document.addEventListener('pointerdown', function(e){ var g=e.target.closest('#canvas .cbox'); if(!g) return; var svg=g.ownerSVGElement, id=g.getAttribute('data-id'); var c=S.model.classes.filter(function(x){return x.id===id;})[0]; if(!c) return;
  var p=svgPoint(svg,e); drag={id:id, dx:p.x-c.x, dy:p.y-c.y}; e.preventDefault(); });
window.addEventListener('pointermove', function(e){ if(!drag) return; var svg=document.querySelector('#canvas svg'); if(!svg) return; var p=svgPoint(svg,e); var c=S.model.classes.filter(function(x){return x.id===drag.id;})[0]; if(!c) return;
  c.x=Math.max(0,Math.round(p.x-drag.dx)); c.y=Math.max(0,Math.round(p.y-drag.dy)); redrawCanvas(); });
window.addEventListener('pointerup', function(){ if(drag){ drag=null; save(); var pu=document.getElementById('puml'); if(pu) pu.textContent=toPlant(S.model); } });
document.addEventListener('keydown', function(e){ var g=e.target.closest && e.target.closest('#canvas .cbox'); if(!g) return; var step=e.shiftKey?40:10, dx=0, dy=0;
  if(e.key==='ArrowLeft') dx=-step; else if(e.key==='ArrowRight') dx=step; else if(e.key==='ArrowUp') dy=-step; else if(e.key==='ArrowDown') dy=step; else return;
  e.preventDefault(); var id=g.getAttribute('data-id'); var c=S.model.classes.filter(function(x){return x.id===id;})[0]; if(!c) return; c.x=Math.max(0,c.x+dx); c.y=Math.max(0,c.y+dy); save(); redrawCanvas(id); });
window.addEventListener('hashchange', function(){ var h=location.hash.replace('#',''); if(TABS.indexOf(h)>=0 && h!==S.tab){ S.tab=h; renderTabs(); renderMain('page'); } });

/* ---------- init ---------- */
load();
ensureUids();
var h0=location.hash.replace('#',''); if(TABS.indexOf(h0)>=0) S.tab=h0;
applyPrefs(); render();
})();
